services:
  nextcloud:
    image: nextcloud:29.0.7-fpm-alpine
    container_name: homelab-nextcloud
    restart: unless-stopped
    volumes:
      - nextcloud-data:/var/www/html
      - nextcloud-config:/var/www/html/config
      - nextcloud-apps:/var/www/html/custom_apps
    environment:
      - POSTGRES_HOST=postgres
      - POSTGRES_DB=nextcloud
      - POSTGRES_USER=nextcloud
      - POSTGRES_PASSWORD=${NEXTCLOUD_DB_PASSWORD}
      - REDIS_HOST=redis
      - REDIS_HOST_PASSWORD=${REDIS_PASSWORD}
      - NEXTCLOUD_ADMIN_USER=${NEXTCLOUD_ADMIN_USER:-admin}
      - NEXTCLOUD_ADMIN_PASSWORD=${NEXTCLOUD_ADMIN_PASSWORD}
      - NEXTCLOUD_TRUSTED_DOMAINS=nextcloud.${DOMAIN}
      - TZ=${TZ:-Asia/Shanghai}
    networks:
      - databases
    labels:
      - "traefik.enable=false"
    healthcheck:
      test: ["CMD-SHELL", "php -f /var/www/html/occ status | grep -q installed || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  nextcloud-nginx:
    image: nginx:1.27-alpine
    container_name: homelab-nextcloud-nginx
    restart: unless-stopped
    volumes:
      - nextcloud-data:/var/www/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - databases
      - proxy
    labels:
      - traefik.enable=true
      - "traefik.http.routers.nextcloud.rule=Host(`nextcloud.${DOMAIN}`)"
      - traefik.http.routers.nextcloud.entrypoints=websecure
      - traefik.http.routers.nextcloud.tls=true
      - traefik.http.services.nextcloud.loadbalancer.server.port=80
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:80/status.php || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
    depends_on:
      - nextcloud

  minio:
    image: minio/minio:RELEASE.2024-09-22T00-33-43Z
    container_name: homelab-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    volumes:
      - minio-data:/data
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER:-admin}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD}
      - TZ=${TZ:-Asia/Shanghai}
    networks:
      - proxy
    labels:
      - traefik.enable=true
      - "traefik.http.routers.minio-console.rule=Host(`minio.${DOMAIN}`)"
      - traefik.http.routers.minio-console.entrypoints=websecure
      - traefik.http.routers.minio-console.tls=true
      - traefik.http.routers.minio-console.service=minio-console
      - traefik.http.services.minio-console.loadbalancer.server.port=9001
      - "traefik.http.routers.minio-api.rule=Host(`s3.${DOMAIN}`)"
      - traefik.http.routers.minio-api.entrypoints=websecure
      - traefik.http.routers.minio-api.tls=true
      - traefik.http.services.minio-api.loadbalancer.server.port=9000
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9000/minio/health/live || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

  filebrowser:
    image: filebrowser/filebrowser:v2.31.1
    container_name: homelab-filebrowser
    restart: unless-stopped
    volumes:
      - filebrowser-data:/database
      - /:/srv:ro
    environment:
      - TZ=${TZ:-Asia/Shanghai}
    networks:
      - proxy
    labels:
      - traefik.enable=true
      - "traefik.http.routers.filebrowser.rule=Host(`files.${DOMAIN}`)"
      - traefik.http.routers.filebrowser.entrypoints=websecure
      - traefik.http.routers.filebrowser.tls=true
      - traefik.http.services.filebrowser.loadbalancer.server.port=80
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:80/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

  syncthing:
    image: lscr.io/linuxserver/syncthing:1.27.11
    container_name: homelab-syncthing
    restart: unless-stopped
    volumes:
      - syncthing-config:/config
      - syncthing-data:/data
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=${TZ:-Asia/Shanghai}
    networks:
      - proxy
    labels:
      - traefik.enable=true
      - "traefik.http.routers.syncthing.rule=Host(`sync.${DOMAIN}`)"
      - traefik.http.routers.syncthing.entrypoints=websecure
      - traefik.http.routers.syncthing.tls=true
      - traefik.http.services.syncthing.loadbalancer.server.port=8384
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8384/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  nextcloud-data:
  nextcloud-config:
  nextcloud-apps:
  minio-data:
  filebrowser-data:
  syncthing-config:
  syncthing-data:

networks:
  databases:
    external: true
  proxy:
    external: true
